name: Actualizar datos

# Revisa cada dos semanas (días 1 y 15 de cada mes) si la SFC o Fogafín publicaron datos nuevos. Si hubo cambios:
# descarga, recalcula, valida, publica cifras y gráficas, y abre un PR con el
# borrador de los párrafos de análisis (que solo sale a la web cuando se aprueba).
on:
  schedule:
    - cron: "0 12 1,15 * *"   # días 1 y 15, 7:00 a. m. hora de Colombia
  workflow_dispatch:
    inputs:
      forzar:
        description: "Correr aunque las fuentes no hayan cambiado"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  datos:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    outputs:
      cambio: ${{ steps.revisar.outputs.cambio }}
    env:
      HAY_CLAVE_CLAUDE: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: ¿Hay datos nuevos?
        id: revisar
        run: |
          if [ "${{ inputs.forzar }}" = "true" ] || python -m etl.cli revisar; then
            echo "cambio=true" >> "$GITHUB_OUTPUT"
          else
            echo "cambio=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Descargar, transformar, validar y publicar
        if: steps.revisar.outputs.cambio == 'true'
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
          MAX_MESES_POR_CORRIDA: "6"   # el 414 tarda ~5 min por mes; el histórico se completa en varias corridas
        run: python -m etl.cli todo

      - name: Guardar datos en el repositorio
        if: steps.revisar.outputs.cambio == 'true'
        run: |
          git config user.name "actualizador-neobancos"
          git config user.email "actions@users.noreply.github.com"
          git add data site/data
          git diff --cached --quiet || git commit -m "Datos SFC/Fogafín actualizados $(date -u +%Y-%m-%d)"
          git push

      - name: Borrador de textos con Claude
        id: redactar
        if: steps.revisar.outputs.cambio == 'true' && env.HAY_CLAVE_CLAUDE == 'true'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m etl.redactar

      - name: Abrir PR con el borrador de textos
        if: steps.redactar.outcome == 'success'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: textos/actualizacion
          title: "Textos del informe: borrador con datos nuevos"
          body-path: data/processed/redaccion.md
          add-paths: content/secciones/*.md
          commit-message: "Borrador de textos de análisis"

  publicar:
    needs: datos
    if: needs.datos.outputs.cambio == 'true'
    uses: ./.github/workflows/publicar.yml
    permissions:
      contents: read
      pages: write
      id-token: write

  aviso-falla:
    needs: datos
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: "Falló la actualización automática del informe de Neobancos",
              body: `Revisar la ejecución: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nSi la validación falló, los detalles están en data/processed/alertas.json. La web sigue mostrando la última versión válida.`
            });
