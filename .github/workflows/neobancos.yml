# Actualización periódica de los datos públicos del informe de Neobancos.
# Descarga de datos.gov.co (SFC y Fogafín), consolida, valida y publica en colombiafintech.co.
# La fecha de la corrida programada se explica en docs/neobancos/actualizacion_datos_publicos.md.
#
# Ampliación (informe web): también descarga los totales del sistema (fuentes "_sistema"),
# arma el informe web (etl/), lo publica en GitHub Pages y abre un issue para revisar los textos.

name: neobancos-datos-publicos

on:
  schedule:
    # La SFC publica el corte del mes M hacia el día 15-19 del mes M+2 (calendario oficial);
    # el corte de diciembre sale hacia el 19-20 de febrero. Hora: 06:00 de Bogotá (11:00 UTC).
    - cron: "0 11 20 1,3-12 *"   # día 20, todos los meses salvo febrero
    - cron: "0 11 22 2 *"        # 22 de febrero
  workflow_dispatch:
    inputs:
      desde:
        description: "Fecha inicial para el formato 414 (AAAA-MM-DD). Vacío = últimos tres meses."
        required: false
        default: ""
      publicar:
        description: "Publicar en WordPress"
        type: boolean
        default: true

permissions:
  contents: write
  issues: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
      NEOBANCOS_HILOS: "8"
      HAY_WP: ${{ secrets.WP_URL != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: uv sync

      - name: Extraer fuentes livianas
        run: uv run python -m scripts.neobancos.extraer entidades_sfc captaciones fogafin_productos fogafin_depositantes tarjetas quejas inclusion cartera tasas_captacion cuif canales

      - name: Extraer fuentes del sistema y solvencia (ampliación para el informe web)
        run: uv run python -m scripts.neobancos.extraer solvencia solvencia_sistema cuif_sistema captaciones_sistema fogafin_productos_sistema fogafin_depositantes_sistema inclusion_sistema cartera_sistema tarjetas_sistema tasas_captacion_sistema

      - name: Extraer formato 414 (pesado)
        run: |
          DESDE="${{ github.event.inputs.desde }}"
          if [ -z "$DESDE" ]; then DESDE="$(date -d '-3 months' +%Y-%m-01)"; fi
          uv run python -m scripts.neobancos.extraer --desde "$DESDE" tasas_colocacion tasas_colocacion_sistema
          uv run python -m scripts.neobancos.extraer tasas_colocacion_recientes tasas_colocacion_recientes_sistema

      - name: Consolidar y validar
        run: uv run python -m scripts.neobancos.consolidar

      - name: Informe web (indicadores, validación y datos de la página)
        run: uv run python -m etl.cli todo

      - name: Guardar resultados
        uses: actions/upload-artifact@v4
        with:
          name: neobancos-${{ github.run_number }}
          path: |
            data/neobancos/*.xlsx
            data/neobancos/web/
            data/neobancos/raw/_extraccion.json

      - name: Guardar el histórico del formato 414 y el informe web en el repositorio
        # El 414 se descarga de forma incremental; el histórico vive en el repo para que la
        # siguiente corrida no tenga que bajarlo completo otra vez.
        run: |
          git config user.name "neobancos-bot"
          git config user.email "neobancos-bot@users.noreply.github.com"
          git add data/neobancos/raw/tasas_colocacion.csv data/neobancos/raw/tasas_colocacion_sistema.csv data/neobancos/raw/_extraccion.json data/processed site/data
          git diff --cached --quiet || git commit -m "Neobancos: actualización de datos públicos"
          git push

      - name: Publicar en WordPress
        # Solo si están configurados los secretos de WordPress (ver docs/neobancos/).
        if: ${{ env.HAY_WP == 'true' && (github.event_name == 'schedule' || github.event.inputs.publicar == 'true') }}
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: uv run python -m scripts.neobancos.publicar_wp

      - name: Recordatorio para revisar los textos del informe web
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `Datos nuevos (${new Date().toISOString().slice(0, 10)}): revisar textos del informe`,
              body: "Las cifras y gráficas del informe web ya se actualizaron. Para revisar los párrafos de análisis, abrir Claude Code en la carpeta CF y pedir: /actualizar-textos-neobancos"
            });

  informe-web:
    needs: actualizar
    uses: ./.github/workflows/publicar.yml
    permissions:
      contents: read
      pages: write
      id-token: write
