name: Publicar informe

# Publica site/ en GitHub Pages. Corre cuando cambian los textos (al aprobar un PR),
# la configuración o el front, y después de cada actualización de datos.
on:
  push:
    branches: [main]
    paths: ["content/**", "config/**", "site/embed.js", "site/index.html", "pyproject.toml", ".github/workflows/publicar.yml"]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Regenerar informe.json con los textos vigentes
        run: uv run python -m etl.cli publicar
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
