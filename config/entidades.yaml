# Grupos y comparadores del informe web.
# El universo (las entidades) NO va aquí: es el de la automatización oficial,
# scripts/neobancos/entidades.csv (asociadas de Colombia Fintech vigiladas por la SFC).
grupos:
  banco: Bancos digitales
  cf: Compañías de financiamiento digitales
  sedpe: SEDPE
# Comparadores: totales del sistema por tipo de entidad SFC (fuentes "_sistema").
comparadores:
  - {id: sis_bancos, nombre: Bancos (sistema),                 tipos: [1]}
  - {id: sis_cf,     nombre: Compañías de financiamiento (sistema), tipos: [4]}
  - {id: sis_ec,     nombre: Establecimientos de crédito,      tipos: [1, 2, 4, 32]}
  - {id: sis_sedpe,  nombre: SEDPE (sistema),                  tipos: [128]}
  - {id: sis_total,  nombre: Sistema (establecimientos de crédito y SEDPE), tipos: [1, 2, 4, 32, 128]}
